// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

// ─── ANIMATION HOOKS ──────────────────────────────────────────────────────────
function useReveal(threshold = 0.12) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setShown(true); io.disconnect(); }
    }, { threshold, rootMargin: "-30px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, [threshold]);
  return [ref, shown];
}

function Reveal({ children, delay = 0, className = "", style = {}, ...rest }) {
  const [ref, shown] = useReveal();
  return (
    <div
      ref={ref}
      className={className}
      style={{
        opacity: shown ? 1 : 0,
        transform: shown ? "translateY(0)" : "translateY(28px)",
        transition: `opacity .85s ${delay}s var(--ease-out), transform .85s ${delay}s var(--ease-out)`,
        willChange: "transform, opacity",
        ...style,
      }}
      {...rest}
    >
      {children}
    </div>
  );
}

function useCountUp(target, duration = 900) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let raf, start;
    const num = parseFloat(target);
    if (isNaN(num)) { setVal(target); return; }
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      setVal(Math.round(num * ease(p) * 100) / 100);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}

function AnimatedNumber({ value, suffix = "", prefix = "" }) {
  const num = parseFloat(String(value).replace(/[^0-9.]/g, ""));
  const animated = useCountUp(num, 1100);
  const display = isNaN(num) ? value : Math.round(animated);
  return <span className="ticker">{prefix}{display}{suffix}</span>;
}

function ScreenSwitch({ screenKey, children }) {
  const [current, setCurrent] = useState({ key: screenKey, content: children });
  const [animating, setAnimating] = useState(false);
  useEffect(() => {
    if (current.key === screenKey) {
      setCurrent({ key: screenKey, content: children });
      return;
    }
    setAnimating(true);
    const t = setTimeout(() => {
      setCurrent({ key: screenKey, content: children });
      setAnimating(false);
    }, 220);
    return () => clearTimeout(t);
  }, [screenKey, children]);
  return (
    <div style={{
      opacity: animating ? 0 : 1,
      transform: animating ? "scale(.985) translateY(8px)" : "scale(1) translateY(0)",
      transition: "opacity .22s var(--ease-out), transform .35s var(--ease-out)",
      transformOrigin: "center top",
      minHeight: "100vh",
    }}>
      {current.content}
    </div>
  );
}

                  background: "transparent", color: "var(--bg)",
                  fontWeight: 500, fontSize: 15, padding: "15px 32px", borderRadius: 10,
                  border: "1px solid rgba(255,255,255,.18)", cursor: "pointer", fontFamily: "inherit",
                  transition: "background .2s",
                }}
                onMouseEnter={(e) => e.currentTarget.style.background = "rgba(255,255,255,.05)"}
                onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}

              </button>
            </div>
            <div className="mono" style={{ fontSize: 12, opacity: .45, marginTop: 32 }}>14 jours gratuits · Sans CB</div>

      {/* FOOTER */}
      <footer style={{ borderTop: "1px solid var(--border)", padding: "40px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 16, maxWidth: 1200, margin: "0 auto" }}>

      </footer>
    </div>
  );
}

                  <span style={{ color: "var(--text)", fontWeight: 600 }}>↑</span> {b.pickup}

                  <span style={{ color: tweaks.accentColor, fontWeight: 600 }}>↓</span> {b.dropoff}

// ═══════════════════════════════════════════════════════════════════════════════
// BOOKING PAGE (Public Driver View)
// ═══════════════════════════════════════════════════════════════════════════════
function BookingPage({ tweaks, onBack }) {
  const [step, setStep] = useState(1);
  const [data, setData] = useState({ pickup: "", dropoff: "", timing: "now", date: "", time: "", name: "", phone: "", email: "", comment: "" });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);

  const totalSteps = 4;

  function update(field, value) {
    setData(prev => ({ ...prev, [field]: value }));
    if (errors[field]) setErrors(prev => { const n = { ...prev }; delete n[field]; return n; });
  }

  function validate(s) {
    const e = {};
    if (s === 1) {
      if (!data.pickup.trim() || data.pickup.length < 3) e.pickup = "Adresse requise (min. 3 caractères)";
      if (!data.dropoff.trim() || data.dropoff.length < 3) e.dropoff = "Adresse requise (min. 3 caractères)";
    }
    if (s === 2 && data.timing === "later") {
      if (!data.date) e.date = "Choisissez une date";
      if (!data.time) e.time = "Choisissez une heure";
    }
    if (s === 3) {
      if (!data.name.trim()) e.name = "Votre nom est requis";
      if (!data.phone.trim()) e.phone = "Votre téléphone est requis";
      if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) e.email = "Email invalide";
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function next() { if (validate(step)) setStep(s => s + 1); }
  function back() { setStep(s => s - 1); }
  function submit() { setSent(true); }

  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)", overflowY: "auto" }}>
      {/* NAV */}
      <nav style={{ position: "sticky", top: 0, background: "rgba(255,255,255,.92)", backdropFilter: "blur(20px)", borderBottom: "1px solid var(--border)", zIndex: 100, boxShadow: "0 1px 12px rgba(0,0,0,.05)" }}>
        <div style={{ maxWidth: 1200, margin: "0 auto", height: 64, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 40px" }}>
          <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", color: "var(--muted)", cursor: "pointer", fontFamily: "inherit", fontSize: 14, fontWeight: 500 }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Retour
          </button>
          <Logo />
          <div style={{ width: 80 }} />
        </div>
      </nav>

      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "60px 40px", display: "grid", gridTemplateColumns: "1fr 420px", gap: 48, alignItems: "start" }}>
        {/* Driver info */}
        <div>
          {/* Hero */}
          <div style={{ display: "flex", gap: 24, alignItems: "flex-start", marginBottom: 40 }}>
            <div style={{ width: 80, height: 80, borderRadius: 16, background: "var(--surface)", border: "1px solid var(--border)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, fontWeight: 900, flexShrink: 0, position: "relative" }}>
              J
              <span style={{ position: "absolute", bottom: -4, right: -4, width: 20, height: 20, borderRadius: "50%", background: tweaks.greenColor, border: "3px solid var(--bg)", boxShadow: `0 0 8px ${tweaks.greenColor}` }} />
            </div>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
                <h1 style={{ fontSize: 32, fontWeight: 900, letterSpacing: "-.03em" }}>{tweaks.driverName}</h1>
                <div style={{ display: "flex", alignItems: "center", gap: 4, background: "rgba(255,180,0,.12)", border: "1px solid rgba(255,180,0,.25)", borderRadius: 6, padding: "3px 10px" }}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="#ffb400" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "#ffb400" }}>4.9</span>
                </div>
              </div>
              <div style={{ fontSize: 16, fontWeight: 600, color: tweaks.accentColor, marginBottom: 8 }}>Chauffeur privé · Île-de-France</div>
              <div style={{ display: "flex", gap: 16, fontSize: 13, color: "var(--muted)" }}>
                <span>📍 Paris</span>
                <span>47 avis clients</span>
                <span>Facture disponible</span>
              </div>
            </div>
          </div>

          <p style={{ fontSize: 15, color: "var(--muted)", lineHeight: 1.7, marginBottom: 40, maxWidth: 520 }}>
            Chauffeur privé depuis 5 ans, je vous accompagne dans tous vos déplacements en Île-de-France avec professionnalisme et discrétion.
          </p>

          {/* Vehicle */}
          <div style={{ marginBottom: 32 }}>
            <h3 style={{ fontSize: 13, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 16 }}>Véhicule</h3>
            <div className="card" style={{ padding: "16px 20px", display: "flex", alignItems: "center", gap: 16 }}>
              <div style={{ fontSize: 28 }}>🚗</div>
              <div>
                <div style={{ fontSize: 15, fontWeight: 700 }}>Mercedes-Benz Classe E · Noir</div>
                <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>3 passagers · Wifi · Eau · Chargeur</div>
              </div>
            </div>
          </div>

          {/* Fixed routes */}
          <div style={{ marginBottom: 32 }}>
            <h3 style={{ fontSize: 13, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 16 }}>Trajets fixes</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {[
                { from: "Paris", to: "CDG", price: "75 €" },
                { from: "Paris", to: "Orly", price: "65 €" },
                { from: "Paris", to: "Demi-journée", price: "300 €" },
              ].map(r => (
                <div key={r.to} className="card" style={{ padding: "14px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontSize: 14 }}><span style={{ fontWeight: 600 }}>{r.from}</span> <span style={{ color: "var(--muted)" }}>→</span> <span style={{ fontWeight: 600 }}>{r.to}</span></div>
                  <span style={{ fontWeight: 800, fontSize: 15 }}>{r.price}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Reviews */}
          <div>
            <h3 style={{ fontSize: 13, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 16 }}>Avis clients</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {[
                { name: "Sophie M.", note: "Ponctuel, discret, véhicule impeccable. Je recommande vivement.", stars: 5 },
                { name: "Marc D.", note: "Service premium, exactement ce qu'il me fallait pour mes déplacements pro.", stars: 5 },
              ].map(r => (
                <div key={r.name} className="card" style={{ padding: "16px 20px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                    <span style={{ fontSize: 14, fontWeight: 700 }}>{r.name}</span>
                    <div style={{ display: "flex", gap: 2 }}>
                      {[...Array(r.stars)].map((_, i) => <svg key={i} width="12" height="12" viewBox="0 0 24 24" fill="#ffb400"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>)}
                    </div>
                  </div>
                  <p style={{ fontSize: 13, color: "var(--muted)", lineHeight: 1.6 }}>{r.note}</p>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Booking form */}
        <div style={{ position: "sticky", top: 84 }}>
          {sent ? (
            <div className="card scale-in" style={{ padding: 32, textAlign: "center" }}>
              <div style={{ width: 60, height: 60, borderRadius: "50%", background: tweaks.greenColor, margin: "0 auto 20px", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `0 0 24px ${tweaks.greenColor}60`, animation: "successPop .6s cubic-bezier(.34, 1.56, .64, 1)" }}>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{ strokeDasharray: 30, animation: "checkDraw .5s .25s both ease-out" }}><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <h3 style={{ fontSize: 22, fontWeight: 900, marginBottom: 8 }}>Demande envoyée !</h3>
              <p style={{ fontSize: 14, color: "var(--muted)", marginBottom: 24, lineHeight: 1.6 }}>Votre chauffeur vous contactera très rapidement.</p>
              <div style={{ background: "var(--surface2)", borderRadius: 10, padding: 16, marginBottom: 24, textAlign: "left" }}>
                {[["Départ", data.pickup], ["Arrivée", data.dropoff], ["Quand", data.timing === "now" ? "Dès que possible" : `${data.date} à ${data.time}`]].map(([l, v]) => (
                  <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid var(--border)", fontSize: 13 }}>
                    <span style={{ color: "var(--muted)", fontWeight: 600 }}>{l}</span>
                    <span style={{ fontWeight: 600, maxWidth: "60%", textAlign: "right" }}>{v}</span>
                  </div>
                ))}
              </div>
              <button className="btn-ghost" style={{ width: "100%" }} onClick={() => { setSent(false); setStep(1); setData({ pickup: "", dropoff: "", timing: "now", date: "", time: "", name: "", phone: "", email: "", comment: "" }); }}>Faire une autre demande</button>
            </div>
          ) : (
            <div className="card" style={{ overflow: "hidden" }}>
              {/* Header */}
              <div style={{ padding: "24px 24px 16px" }}>
                <div style={{ fontSize: 18, fontWeight: 800, marginBottom: 4 }}>Réserver une course</div>
                <div style={{ fontSize: 13, color: "var(--muted)" }}>Réponse sous quelques minutes.</div>
              </div>

              {/* Progress */}
              <div style={{ padding: "0 24px 20px" }}>
                <div style={{ display: "flex", gap: 4 }}>
                  {[...Array(totalSteps)].map((_, i) => (
                    <div key={i} style={{ flex: 1, height: 3, borderRadius: 2, background: i + 1 <= step ? tweaks.accentColor : "var(--border)", transition: "background .3s" }} />
                  ))}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 11, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase", letterSpacing: ".06em" }}>
                  <span>Étape {step}/{totalSteps}</span>
                  <span>{["Trajet","Quand","Vos infos","Confirmation"][step-1]}</span>
                </div>
              </div>

              {/* Steps */}
              <div className="slide-in-right" key={step} style={{ padding: "0 24px", minHeight: 200 }}>
                {step === 1 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    <FormField label="Adresse de départ" error={errors.pickup}>
                      <input type="text" value={data.pickup} onChange={e => update("pickup", e.target.value)} placeholder="Ex: 15 rue de Rivoli, Paris" />
                    </FormField>
                    <FormField label="Adresse d'arrivée" error={errors.dropoff}>
                      <input type="text" value={data.dropoff} onChange={e => update("dropoff", e.target.value)} placeholder="Ex: Aéroport CDG Terminal 2" />
                    </FormField>
                  </div>
                )}
                {step === 2 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      {[["now","Maintenant"], ["later","Plus tard"]].map(([v, l]) => (
                        <button key={v} onClick={() => update("timing", v)} style={{ padding: "14px", borderRadius: 8, border: `2px solid ${data.timing === v ? tweaks.accentColor : "var(--border)"}`, background: data.timing === v ? `${tweaks.accentColor}18` : "var(--surface2)", color: data.timing === v ? tweaks.accentColor : "var(--muted)", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", transition: "all .15s" }}>
                          {l}
                        </button>
                      ))}
                    </div>
                    {data.timing === "later" && (
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                        <FormField label="Date" error={errors.date}>
                          <input type="date" value={data.date} onChange={e => update("date", e.target.value)} min={new Date().toISOString().split("T")[0]} />
                        </FormField>
                        <FormField label="Heure" error={errors.time}>
                          <input type="time" value={data.time} onChange={e => update("time", e.target.value)} />
                        </FormField>
                      </div>
                    )}
                  </div>
                )}
                {step === 3 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    <FormField label="Votre nom" error={errors.name}>
                      <input type="text" value={data.name} onChange={e => update("name", e.target.value)} placeholder="Jean Martin" />
                    </FormField>
                    <FormField label="Téléphone" error={errors.phone}>
                      <input type="tel" value={data.phone} onChange={e => update("phone", e.target.value)} placeholder="06 12 34 56 78" />
                    </FormField>
                    <FormField label="Email (optionnel)" error={errors.email}>
                      <input type="email" value={data.email} onChange={e => update("email", e.target.value)} placeholder="jean@email.com" />
                    </FormField>
                    <FormField label="Commentaire (optionnel)">
                      <textarea rows={2} value={data.comment} onChange={e => update("comment", e.target.value)} placeholder="Nombre de bagages, siège enfant..." style={{ resize: "none" }} />
                    </FormField>
                  </div>
                )}
                {step === 4 && (
                  <div style={{ background: "var(--surface2)", borderRadius: 10, padding: 16 }}>
                    {[["Départ", data.pickup], ["Arrivée", data.dropoff], ["Quand", data.timing === "now" ? "Dès que possible" : `${data.date} à ${data.time}`], ["Nom", data.name], ["Téléphone", data.phone]].filter(([,v]) => v).map(([l, v]) => (
                      <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--border)", fontSize: 13 }}>
                        <span style={{ color: "var(--muted)", fontWeight: 600 }}>{l}</span>
                        <span style={{ fontWeight: 600, maxWidth: "60%", textAlign: "right" }}>{v}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Actions */}
              <div style={{ padding: 24, display: "flex", gap: 8, marginTop: 16 }}>
                {step > 1 && <button className="btn-ghost" style={{ padding: "12px 20px", fontSize: 14 }} onClick={back}>Retour</button>}
                {step < totalSteps
                  ? <button className="btn-black" style={{ flex: 1, fontSize: 14 }} onClick={next}>Continuer</button>
                  : <button className="btn-black" style={{ flex: 1, fontSize: 14 }} onClick={submit}>Envoyer ma demande</button>
                }
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Logo({ size = "md", color }) {

  const fg = color || "var(--text)";

    <div style={{ display: "flex", alignItems: "center", gap: big ? 10 : 8, cursor: "pointer" }}>
      <div style={{ width: big ? 30 : 24, height: big ? 30 : 24, borderRadius: "50%", background: fg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, position: "relative" }}>
        <span className="display" style={{ fontSize: big ? 16 : 13, fontWeight: 500, fontStyle: "italic", color: "var(--bg)", lineHeight: 1, marginTop: 1 }}>P</span>
      </div>
      <span style={{ fontSize: big ? 17 : 15, fontWeight: 600, letterSpacing: "-.02em", color: fg }}>Privé<span style={{ fontWeight: 400, opacity: .65 }}>chauffeur</span></span>
    </div>
  );
}

function FormField({ label, error, children }) {
  return (
    <div>
      <label style={{ display: "block", fontSize: 12, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 6 }}>{label}</label>
      {children}
      {error && <div style={{ fontSize: 11, color: "#ef4444", fontWeight: 600, marginTop: 4 }}>{error}</div>}
    </div>
  );
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
